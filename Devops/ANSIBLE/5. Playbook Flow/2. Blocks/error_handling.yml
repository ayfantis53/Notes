---
- name: Error Handling
  hosts: server1
  tasks:
    - block:
        - name: Install MySQL
          ansible.builtin.yum: name= mysql-server state=present
        - name: Start MySQL Service
          ansible.builtin.service: name=mysql-server state=started

      become_user: db-user
      when: ansible_facts['distribution'] == 'CentOS'

      # Happens if code fails.
      rescue:
        - mail:
            to: admin@company.com
            subject: Installation Failed
            body: DB Install Failed at {{ ansible_failed_task.name }}

      # Happens no matter what.
      always:
        - mail:
            to: admin@company.com
            subject: Installation Status
            body: DB Install Status {{ ansible_failed_result }}