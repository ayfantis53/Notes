---
- name: Install httpd
  hosts: all
  tasks:
  - name: Install httpd
    yum:
      name: httpd
      state: installed
    tags: install

  - name: Start httpd service
    service:
      name: httpd
      state: started
    tags: start httpd service

# ansible-playbook tags.yml --tags "install"
# ansible-playbook tags.yml --skip-tags "start httpd service"