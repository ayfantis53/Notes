# Default location /etc/ansible/ansible.cfg
# Can have a config in subfolders if different settings needed, they will overwrite default for that directory

[defaults]

inventory                    = /etc/ansible/hosts
log_path                     = /var/log/ansible.log

library                      = /usr/share/my_modules
roles_path                   = /etc/ansible/roles_path
action_plugins               = /usr/share/ansible/plugins/action_plugins

gathering                    = implicit

# SSH timeout
timeout                      = 10
forks                        = 5


[inventory]
enable_plugins               = host_list, virtual_box, yaml, constructed


[privilege_escalation]


[paramiko_connection]


[ssh_connection]


[persistent_connection]


[colors]