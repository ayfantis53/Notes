---
- name: Filesystems
  hosts: all
  tasks:
    - name: Create Filesystems
      ansible.builtin.filesystem:
        fstype: ext4
        dev: /dev

        opts: -cc

    - name: Mount Filesystems
      ansible.builtin.mount:
        fstype: ext4
        src: /dev/vg1/lvol1
        psth: /opt/app
        state: mounted


---
- name: Files
  hosts: all
  tasks:
    - name: Create Directory
      ansible.builtin.file:
        path: /opt/app/web
        state: directory

    - name: Create File
      ansible.builtin.file:
        path: /opt/app/web/index.html
        owner: app-owner
        group: app-owner
        state: touch
        mode: '0644'