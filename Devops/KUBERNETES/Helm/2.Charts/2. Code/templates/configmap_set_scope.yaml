apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-appinfo
data:
  background: {{ .Values.app.ui.bg }}
  foreground: {{ .Values.app.ui.fg }}
  database:   {{ .Values.app.db.name }}
  connection: {{ .Values.app.db.conn }}


# Set a SCOPE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-appinfo
data:
 {{- with .Values.app }}
   {{- with .ui }}
    background: {{ .bg }}
    foreground: {{ .fg }}
   {{- end }}
   {{- with .db }}
    database:   {{ .name }}
    connection: {{ .conn }}
   {{- end }}
  release: {{ $.Release.Name }}       # Accessing root outside the current scope with $
  {{- end }}