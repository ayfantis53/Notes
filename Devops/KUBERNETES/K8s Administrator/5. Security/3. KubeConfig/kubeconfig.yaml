apiVersion: v1
kind: Config
cuurent-context: dev-user@google            # default context to use unless specified.

clusters:
  - name: {{ $CLUSTER_NAME }}
    cluster:
      certificate-authority: /etc/kubernetes/pki/ca.crt
      server: https://{{ $CLUSTER_NAME }}:{{ $PORT }}
  - name: development
  - name: production
  - name: google

contexts:
  - name: my-kube-admin@{{ $CLUSTER_NAME }}
    context:
      cluster: {{ $CLUSTER_NAME }}
      user: my-kube-admin
      namespace: finance
  - name: dev-user@google
  - name: prod-user@production

users:
  - name: my-kube-admin
    user:
      client-certificate: /etc/kubernetes/pki/users/admin.crt
      client-key: /etc/kubernetes/pki/users/admin.key
  - name: admin
  - name: dev-user
  - name: prod-user