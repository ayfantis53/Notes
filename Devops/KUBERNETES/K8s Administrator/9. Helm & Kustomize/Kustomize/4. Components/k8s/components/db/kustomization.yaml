## recommended just in case theres any breaking version changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


## kubernetes resources (files) to be managed by kustomize.
resources:
  - postgres-deployment.yaml


# ======
# Customizations that need to be made
# ======
secretGenerator:
  - name: postgres-cred
    literals:
      - password=postgres123

patches:
  - deployment-patch.yaml
  