apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: simple-webapp
  labels:
    app: App1
    Function: Front-end
  annotations:
    buildVersion: 1.34
spec:
  replicas: 3
  selector:
    matchLabels:
      app: App1                 # Labels of replicaset need to match labels of containers
  template:
    metadata:
      labels:
        app: App1               # Labels of containers need to match the replicaset
        function: Front-end
    spec:
      containers:
      - name: simple-webapp
        image: simple-webapp